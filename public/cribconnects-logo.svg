<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect x="2" y="2" width="56" height="56" rx="14" fill="#5BC8E8"/>

  <!-- Person silhouette -->
  <g transform="translate(30, 20)">
    <!-- Head circle -->
    <circle cx="0" cy="0" r="5" fill="white"/>

    <!-- Shoulders/body -->
    <path d="M -7 8 C -7 8, -7 5, -4 4 L -2 3 C -2 3, 0 2.5, 2 3 L 4 4 C 7 5, 7 8, 7 8 L 7 15 C 7 15, 5 16, 0 16 C -5 16, -7 15, -7 15 Z" fill="white"/>

    <!-- AI Badge on chest -->
    <rect x="-6" y="8" width="12" height="6" rx="2" fill="#0B2B5C"/>
    <text x="0" y="12.5" font-family="Arial, sans-serif" font-size="4.5" font-weight="bold" fill="white" text-anchor="middle">AI</text>

    <!-- Small dots (decorative) -->
    <circle cx="-10" cy="-5" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="-8" cy="-8" r="1" fill="white" opacity="0.4"/>
    <circle cx="10" cy="-3" r="1.5" fill="white" opacity="0.5"/>
  </g>

  <!-- CribConnects Text -->
  <text x="70" y="39" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0B2B5C" letter-spacing="-0.5">CribConnects</text>
</svg>
