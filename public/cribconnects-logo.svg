<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect x="2" y="2" width="56" height="56" rx="12" fill="#88D8E8"/>

  <!-- AI Icon - Person with AI badge -->
  <g transform="translate(30, 30)">
    <!-- Head -->
    <circle cx="0" cy="-8" r="6" fill="white"/>
    <!-- Body -->
    <path d="M -8 2 Q -8 -2, -4 -4 L 4 -4 Q 8 -2, 8 2 L 8 10 L -8 10 Z" fill="white"/>
    <!-- AI Badge -->
    <rect x="-5" y="2" width="10" height="6" rx="2" fill="#1E3A8A"/>
    <text x="0" y="6.5" font-family="Inter, sans-serif" font-size="4" font-weight="700" fill="white" text-anchor="middle">AI</text>
  </g>

  <!-- CribConnects Text -->
  <text x="70" y="38" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">CribConnects</text>
</svg>
